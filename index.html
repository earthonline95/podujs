<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>坡比计算器 (绘图版)</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --accent: #ef4444; /* 红色用于标注高差 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            padding-bottom: 80px;
        }

        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 10px; color: var(--primary); }
        p.subtitle { text-align: center; color: var(--text-light); font-size: 0.9rem; margin-bottom: 25px; }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 输入区域 */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; color: var(--text-light); margin-bottom: 6px; }
        .input-wrapper { position: relative; }
        input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f9fafb;
            transition: border 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); background: #fff; }
        .unit { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); pointer-events: none; }

        /* 按钮 */
        .btn-row { display: flex; gap: 15px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-calc { background: var(--primary); color: white; }
        .btn-reset { background: #e5e7eb; color: var(--text); }

        /* 结果展示 */
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .result-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .result-label { font-size: 0.8rem; color: var(--text-light); margin-bottom: 5px; }
        .result-value { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .result-unit { font-size: 0.75rem; color: var(--text-light); margin-left: 2px; }

        /* SVG 绘图区域 */
        .svg-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            background: #fafafa;
            border-radius: 8px;
            padding: 10px;
            border: 1px dashed var(--border);
        }
        svg {
            width: 100%;
            max-width: 400px;
            height: auto;
            overflow: visible;
        }
        /* SVG 内部样式 */
        .svg-line { stroke: var(--text); stroke-width: 2; fill: none; }
        .svg-shape { fill: rgba(37, 99, 235, 0.1); stroke: var(--primary); stroke-width: 2; }
        .svg-text { font-size: 12px; fill: var(--text); font-weight: bold; }
        .svg-text-h { fill: var(--accent); } /* 高差文字红色 */
        .svg-dim-line { stroke: var(--text-light); stroke-width: 1; stroke-dasharray: 4; }
        .svg-angle-arc { fill: none; stroke: var(--primary); stroke-width: 1.5; }

        /* 历史记录 */
        .history-list { max-height: 300px; overflow-y: auto; }
        .history-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            font-size: 0.85rem;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .history-item:last-child { border-bottom: none; }
        .empty-tip { text-align: center; color: var(--text-light); padding: 20px; font-size: 0.9rem; }

        @media (max-width: 480px) {
            .result-grid { grid-template-columns: 1fr; }
            .history-item { grid-template-columns: 1fr; gap: 5px; text-align: center; }
        }
    </style>
</head>
<body>

    <h1>📐 坡比计算器</h1>
    <p class="subtitle">输入标高与坡长，自动生成剖面图</p>

    <!-- 输入区 -->
    <div class="card">
        <div class="input-group">
            <label>上标高 (m)</label>
            <div class="input-wrapper">
                <input type="number" id="upperElev" placeholder="例如: 105.5" step="any" inputmode="decimal">
            </div>
        </div>
        <div class="input-group">
            <label>下标高 (m)</label>
            <div class="input-wrapper">
                <input type="number" id="lowerElev" placeholder="例如: 100.0" step="any" inputmode="decimal">
            </div>
        </div>
        <div class="input-group">
            <label>坡长/斜距 (m)</label>
            <div class="input-wrapper">
                <input type="number" id="slopeLen" placeholder="例如: 20.0" step="any" inputmode="decimal">
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-reset" onclick="resetAll()">重置</button>
            <button class="btn-calc" onclick="calculate()">开始计算</button>
        </div>
    </div>

    <!-- 结果区 -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="card-title">计算结果</div>
        <div class="result-grid">
            <div class="result-item">
                <div class="result-label">坡比 (1:n)</div>
                <div class="result-value" id="resRatio">—</div>
            </div>
            <div class="result-item">
                <div class="result-label">坡度角 (θ)</div>
                <div class="result-value" id="resAngle">—<span class="result-unit">°</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">高差 (H)</div>
                <div class="result-value" id="resHeight">—<span class="result-unit">m</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">水平距离 (L)</div>
                <div class="result-value" id="resHoriz">—<span class="result-unit">m</span></div>
            </div>
        </div>

        <!-- SVG 绘图区 -->
        <div class="card-title" style="margin-top: 25px;">剖面示意图</div>
        <div class="svg-container">
            <svg viewBox="0 0 300 200" id="slopeSvg">
                <!-- 动态内容将通过 JS 插入这里 -->
            </svg>
        </div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
        <div class="card-title">
            历史记录
            <span style="font-size: 0.8rem; font-weight: 400; color: var(--primary); cursor: pointer;" onclick="clearHistory()">清空</span>
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-tip">暂无记录</div>
        </div>
    </div>

    <script>
        // 计算逻辑
        function calculate() {
            const upper = parseFloat(document.getElementById('upperElev').value);
            const lower = parseFloat(document.getElementById('lowerElev').value);
            const slope = parseFloat(document.getElementById('slopeLen').value);

            if (isNaN(upper) || isNaN(lower) || isNaN(slope)) {
                alert("请填写完整的数值！");
                return;
            }
            if (upper <= lower) {
                alert("上标高必须大于下标高！");
                return;
            }
            
            const H = upper - lower; // 高差
            if (slope <= H) {
                alert("坡长必须大于高差，否则无法构成三角形！");
                return;
            }

            const L = Math.sqrt(Math.pow(slope, 2) - Math.pow(H, 2)); // 水平距离
            const ratioN = L / H; // 坡比分母
            const angle = Math.atan(H / L) * (180 / Math.PI); // 角度

            // 更新UI数值
            document.getElementById('resRatio').textContent = `1 : ${ratioN.toFixed(3)}`;
            document.getElementById('resAngle').textContent = angle.toFixed(2);
            document.getElementById('resHeight').textContent = H.toFixed(3);
            document.getElementById('resHoriz').textContent = L.toFixed(3);

            document.getElementById('resultCard').style.display = 'block';
            
            // 绘制 SVG
            drawSvg(L, H, slope, angle);
            
            // 滚动到结果
            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });

            // 保存历史
            saveHistory({
                time: new Date().toLocaleTimeString(),
                ratio: `1:${ratioN.toFixed(2)}`,
                angle: `${angle.toFixed(1)}°`,
                height: H.toFixed(2)
            });
        }

        function resetAll() {
            document.getElementById('upperElev').value = '';
            document.getElementById('lowerElev').value = '';
            document.getElementById('slopeLen').value = '';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('slopeSvg').innerHTML = ''; // 清空绘图
        }

        // SVG 绘图函数
        function drawSvg(L, H, S, angleDeg) {
            const svg = document.getElementById('slopeSvg');
            
            // 定义绘图区域边距
            const padding = 40;
            const width = 300;
            const height = 200;
            
            // 计算缩放比例，让三角形适应 SVG 区域
            // 我们希望三角形占据大部分空间
            const availableW = width - padding * 2;
            const availableH = height - padding * 2;
            
            const scale = Math.min(availableW / L, availableH / H);
            
            const drawL = L * scale;
            const drawH = H * scale;
            
            // 定义三个顶点坐标 (原点在左上角，所以Y轴向下)
            // A: 左下角 (直角)
            // B: 右下角
            // C: 左上角 (顶点)
            const Ax = padding;
            const Ay = height - padding;
            
            const Bx = padding + drawL;
            const By = height - padding;
            
            const Cx = padding;
            const Cy = height - padding - drawH;

            // 生成角度弧线路径 (简单的二次贝塞尔曲线模拟)
            const arcR = 30; // 弧线半径
            // 计算弧线终点 (在斜边上)
            const rad = angleDeg * Math.PI / 180;
            const arcEndX = Cx + arcR * Math.cos(rad);
            const arcEndY = Cy + arcR * Math.sin(rad);

            svg.innerHTML = `
                <!-- 填充区域 -->
                <polygon points="${Cx},${Cy} ${Ax},${Ay} ${Bx},${By}" class="svg-shape" />
                
                <!-- 标注线 (虚线) -->
                <!-- 高差标注线 (左侧) -->
                <line x1="${Cx - 15}" y1="${Cy}" x2="${Cx - 15}" y2="${Ay}" class="svg-dim-line" />
                <line x1="${Cx - 20}" y1="${Cy}" x2="${Cx - 10}" y2="${Cy}" class="svg-dim-line" />
                <line x1="${Cx - 20}" y1="${Ay}" x2="${Cx - 10}" y2="${Ay}" class="svg-dim-line" />
                
                <!-- 水平距离标注线 (底部) -->
                <line x1="${Ax}" y1="${Ay + 15}" x2="${Bx}" y2="${By + 15}" class="svg-dim-line" />
                <line x1="${Ax}" y1="${Ay + 10}" x2="${Ax}" y2="${Ay + 20}" class="svg-dim-line" />
                <line x1="${Bx}" y1="${By + 10}" x2="${Bx}" y2="${By + 20}" class="svg-dim-line" />

                <!-- 文字标注 -->
                <!-- 高差 H -->
                <text x="${Cx - 25}" y="${(Cy + Ay)/2 + 5}" text-anchor="middle" class="svg-text svg-text-h" transform="rotate(-90, ${Cx - 25}, ${(Cy + Ay)/2 + 5})">H=${H.toFixed(2)}</text>
                
                <!-- 水平距离 L -->
                <text x="${(Ax + Bx)/2}" y="${Ay + 30}" text-anchor="middle" class="svg-text">L=${L.toFixed(2)}</text>
                
                <!-- 斜边 S -->
                <text x="${(Cx + Bx)/2 + 10}" y="${(Cy + By)/2 - 5}" text-anchor="start" class="svg-text">S=${S.toFixed(2)}</text>

                <!-- 角度标注 -->
                <path d="M ${Cx} ${Cy + arcR} A ${arcR} ${arcR} 0 0 1 ${arcEndX} ${arcEndY}" class="svg-angle-arc" />
                <text x="${Cx + 25}" y="${Cy + 20}" class="svg-text" style="font-size: 10px;">${angleDeg.toFixed(1)}°</text>
            `;
        }

        // 历史记录逻辑
        function saveHistory(data) {
            let history = JSON.parse(localStorage.getItem('slopeHistory') || '[]');
            history.unshift(data);
            if (history.length > 50) history.pop();
            localStorage.setItem('slopeHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('slopeHistory') || '[]');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="empty-tip">暂无记录</div>';
                return;
            }

            list.innerHTML = `
                <div class="history-item history-header">
                    <span>时间</span>
                    <span>坡比</span>
                    <span>高差</span>
                </div>
                ${history.map(item => `
                    <div class="history-item">
                        <span>${item.time}</span>
                        <span style="color:var(--primary); font-weight:bold;">${item.ratio}</span>
                        <span>${item.height}m</span>
                    </div>
                `).join('')}
            `;
        }

        function clearHistory() {
            if(confirm('确定清空所有历史记录吗？')) {
                localStorage.removeItem('slopeHistory');
                renderHistory();
            }
        }

        // 初始化
        renderHistory();
    </script>
</body>
</html>
